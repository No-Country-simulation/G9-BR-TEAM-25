version: '3.8'

services:

  techmind-ai-service:

    build:
      context: .
      dockerfile: Dockerfile

    container_name: techmind-ai-service

    ports:
      - "8000:8000"

    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - BACKEND_URL=http://backend-java:8080
      - PYTHONUNBUFFERED=1

    volumes:
      - ./models:/app/models
      - ./data:/app/data

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

    restart: unless-stopped