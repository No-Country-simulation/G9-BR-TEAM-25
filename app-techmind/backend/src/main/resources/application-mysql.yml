spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/techmind?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  h2:
    console.enabled: false
  jpa:
    hibernate.ddl-auto: update
  flyway:
    enabled: false
ml-service:
  mock-enabled: true
