spring:
  config:
    activate:
      on-profile: oci
  h2:
    console.enabled: false
  jpa:
    hibernate.ddl-auto: validate
  flyway:
    locations: classpath:db/migration/oracle
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: Initial OCI schema baseline
oci:
  database:
    enabled: ${OCI_DATABASE_ENABLED:true}
ml-service:
  mock-enabled: ${ML_SERVICE_MOCK_ENABLED:false}
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
