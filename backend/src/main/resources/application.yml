server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: techmind-classificador
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:h2:mem:techmind;MODE=MySQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  h2:
    console.enabled: ${H2_CONSOLE_ENABLED:true}
  jpa:
    hibernate.ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: false
ml-service:
  url: ${ML_SERVICE_URL:http://localhost:8000}
  mock-enabled: ${ML_SERVICE_MOCK_ENABLED:false}
oci:
  database:
    enabled: ${OCI_DATABASE_ENABLED:false}
    url: ${OCI_DATABASE_URL:jdbc:oracle:thin:@techminddb_high}
    username: ${OCI_DATABASE_USERNAME:}
    password: ${OCI_DATABASE_PASSWORD:}
    wallet-path: ${OCI_WALLET_PATH:/opt/oracle/wallet}
management:
  endpoints.web.exposure.include: health,info
springdoc:
  api-docs.path: /v3/api-docs
  swagger-ui.path: /swagger-ui.html
