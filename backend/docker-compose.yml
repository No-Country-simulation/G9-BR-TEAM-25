services:
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      ML_SERVICE_URL: http://ml-service:8000
    depends_on:
      ml-service:
        condition: service_started
  ml-service:
    build: ./ml-service
    ports: ["8000:8000"]
    volumes:
      - ../techmind-ai-service/models/classificador_techmind.pkl:/app/classificador_techmind.pkl:ro
